name: Database Migration CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'changelogs/**'
      - '.github/workflows/**'

jobs:
  validate-schema-migrations:
    name: Test Migration & Rollback
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ephemeral_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Liquibase CLI
        uses: liquibase/setup-liquibase@v1
        with:
          version: '4.33.0'

      - name: Execute Forward & Rollback Verification
        run: |
          liquibase --changelog-file=changelogs/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/ephemeral_db \
            --username=postgres \
            --password=testpassword \
            update-testing-rollback
