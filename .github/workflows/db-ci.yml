name: Database Migration CI

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'changelogs/**'

jobs:
  validate-schema-migrations:
    name: Test Migration & Rollback
    runs-on: ubuntu-latest

    # Ephemeral database service container spun up exclusively for this run
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ephemeral_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Liquibase
        uses: liquibase/liquibase-github-action@v1.0.0
        with:
          version: '4.33.0'

      - name: Execute Forward & Rollback Verification
        run: |
          liquibase --changelog-file=changelogs/db.changelog-master.xml \
            --url=jdbc:postgresql://postgres:5432/ephemeral_db \
            --username=postgres \
            --password=testpassword \
            update-testing-rollback
